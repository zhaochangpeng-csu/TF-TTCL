experiment:
  data_path: "data/OPEN/geography.json"
  limit: 5000
  input_order: "forward"  # forward / reverse / random could modify the order of the input data, but the evaluate folder only supports forward order.
  shuffle_seed: 0    # only effective in random mode
  mode: "open"
  domain: "geography"

prompt_file_path:
  teacher: "core/source/prompts/open/role/teacher/geography.md"
  ta: "core/source/prompts/open/role/ta/geography.md"
  student: "core/source/prompts/open/role/student/geography.md"
  positive_batch: "core/source/prompts/open/rule/positive/geography.md"
  negative_batch: "core/source/prompts/open/rule/negative/geography.md"

llm:
  api_url: "http://127.0.0.1:8000/v1"
  api_key: "local-tfttcl"
  model_name: "llama31-8b"
  max_tokens: 8192
  max_context_tokens: 32768

rag:
  enabled: true
  embedding_api_url: "http://127.0.0.1:10000/v1"
  embedding_api_key: "local-tfttcl"
  embedding_model: "qwen3-embedding-0.6b"

rules:
  max_pos_rules: 30
  max_neg_rules: 30

student:
  number: 4

batch:
  enabled: false
  size: 1

debug:
  save_variants: true
  log_prompts: true
  quiet: false

security:
  log_expected_output: false
  write_labels_to_result: true
  write_private_labels_file: false

ablation:
  remove_ta: false
  remove_qsa: false
  remove_ced: false
  remove_crr: false
  random_rules: false
  use_max_ppl_for_negative_selection: false

pruning:
  enabled: false
  max_repo_size: 100
  strategy: ""
  similarity_threshold: 0.95

confuse_mode:
  enabled: false
