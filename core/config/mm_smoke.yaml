  rrf_k: 60
ablation:
  text_variants: true
  image_variant: true
  joint_variant: true
  invariance: true
  sensitivity: true
  evidence: true
  logprob_tiebreak: false
  rule_memory: true
  episode_memory: true
  positive_memory: true
  negative_memory: true
  memory_gate: true
  retrieval_modalities: [text, image, joint]
