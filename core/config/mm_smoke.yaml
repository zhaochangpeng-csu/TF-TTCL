experiment:
  dataset: scienceqa_img
  data_path: data/multimodal/smoke/smoke.jsonl
  image_root: data/multimodal/smoke
  output_dir: core/exp_res/mm/smoke/qwen25vl/evimem/seed0
  method: evimem
  limit: 2
  order: forward
  seed: 0
  resume: false
model:
  api_url: http://127.0.0.1:9000/v1
  api_key_env: OPENAI_API_KEY
  model_name: Qwen/Qwen2.5-VL-7B-Instruct
  max_tokens: 128
  timeout: 300
  request_logprobs: false
memory:
  embedder: hash
  dimensions: 256
