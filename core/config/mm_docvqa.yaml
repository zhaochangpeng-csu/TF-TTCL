experiment:
  dataset: docvqa
  data_path: data/multimodal/docvqa/docvqa_validation.jsonl
  image_root: data/multimodal/docvqa
  output_dir: core/exp_res/mm/docvqa/qwen25vl/evimem/seed0
  method: evimem
  limit: 20
  order: forward
  seed: 0
  resume: true
model:
  api_url: http://127.0.0.1:9000/v1
  api_key_env: OPENAI_API_KEY
  model_name: Qwen/Qwen2.5-VL-7B-Instruct
  max_tokens: 128
  timeout: 300
  request_logprobs: false
memory:
  embedder: vllm_multimodal
  api_url: http://127.0.0.1:9001/v1
  model_name: Qwen/Qwen3-VL-Embedding-2B
  api_key_env: EMBEDDING_API_KEY
  timeout: 300
  max_experiences: 1000
  rrf_k: 60
  rule_min_similarity: 0.50
  episode_min_similarity: 0.75
ablation:
  text_variants: true
  image_variant: true
  joint_variant: true
  invariance: true
  sensitivity: true
  evidence: true
  logprob_tiebreak: true
  rule_memory: true
  episode_memory: true
  positive_memory: true
  negative_memory: true
  memory_gate: true
  retrieval_modalities: [text, image, joint]
